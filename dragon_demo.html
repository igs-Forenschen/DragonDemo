<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>火龍表演模擬器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
#wrap{position:relative;overflow:hidden;}
#bgImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
#gameCanvas{position:absolute;inset:0;}
#hud{position:absolute;inset:0;pointer-events:none;}
#statusEl{position:absolute;top:1.8%;left:50%;transform:translateX(-50%);font-size:clamp(11px,1.4vw,16px);color:#ffd8a0;background:#00000066;padding:3px 14px;border-radius:20px;white-space:nowrap;font-family:sans-serif;}
#mulEl{position:absolute;left:0;right:0;top:32%;text-align:center;font-size:clamp(40px,7vw,80px);font-weight:700;color:#ffdd44;opacity:0;line-height:1;font-family:sans-serif;text-shadow:0 0 30px #ff8800,0 2px 0 #a05000;}
.bb{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:clamp(5px,1%,10px) clamp(10px,2%,20px);background:#000000bb;pointer-events:all;}
.cd{display:flex;align-items:center;gap:6px;color:#ffee88;font-size:clamp(11px,1.3vw,15px);font-family:sans-serif;}
.ci{width:clamp(16px,2vw,22px);height:clamp(16px,2vw,22px);border-radius:50%;background:#ffcc00;border:2px solid #ff8800;display:flex;align-items:center;justify-content:center;font-size:clamp(8px,1vw,11px);color:#7a4000;font-weight:700;}
.lv{font-size:clamp(9px,1vw,12px);color:#ffee8860;font-family:sans-serif;}
.br{display:flex;align-items:center;gap:6px;}
.bl{font-size:clamp(9px,1vw,12px);color:#ffee8860;font-family:sans-serif;}
.bbn{width:clamp(18px,2.2vw,26px);height:clamp(18px,2.2vw,26px);border-radius:50%;background:#333;border:1px solid #666;color:#fff;font-size:clamp(12px,1.6vw,18px);cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:all;}
.bv{font-size:clamp(12px,1.5vw,16px);font-weight:600;color:#ffee88;min-width:36px;text-align:center;font-family:sans-serif;}
.gb{position:absolute;left:clamp(6px,1.2%,14px);top:50%;transform:translateY(-50%);width:clamp(30px,4vw,42px);height:clamp(30px,4vw,42px);border-radius:50%;background:#00000088;border:1.5px solid #ffffff30;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:all;}
.ab{position:absolute;right:clamp(6px,1.2%,14px);top:50%;transform:translateY(-50%);width:clamp(44px,6.5vw,70px);height:clamp(44px,6.5vw,70px);border-radius:50%;background:#c84000ec;border:3px solid #ff8800;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:all;}
#winEl{display:none;font-size:clamp(13px,1.8vw,18px);font-weight:600;color:#ffee44;margin-left:8px;font-family:sans-serif;}
</style>
</head>
<body>
<div id="wrap">
  <img id="bgImg" src="background.png" alt="">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div id="statusEl"></div>
    <div id="mulEl"></div>
    <div id="s3TurretWrap" style="position:absolute;bottom:var(--bbH,42px);left:50%;transform:translateX(-50%);width:clamp(200px,38vw,608px);pointer-events:none;display:none;z-index:6;">
      <img id="s3TurretImg" src="dragon/06.png" style="width:100%;height:auto;display:block;">
    </div>
    <div class="bb">
      <span class="lv">LV.C3065 SU</span>
      <div class="cd">
        <div class="ci" id="ciEl">$</div>
        <span>999,999,999</span>
        <span id="winEl"></span>
      </div>
      <div class="br">
        <span class="bl">BET</span>
        <button class="bbn" onclick="chgBet(-1)">-</button>
        <span class="bv" id="bval">999</span>
        <button class="bbn" onclick="chgBet(1)">+</button>
      </div>
      <div style="display:flex;gap:4px;margin-left:6px;pointer-events:all;flex-shrink:0;">
        <button class="showBtn active" id="btn1" onclick="selectShow(1)">亂噴</button>
        <button class="showBtn" id="btn2" onclick="selectShow(2)">正面</button>
        <button class="showBtn" id="btn3" onclick="selectShow(3)">小火</button>
        <button class="showBtn" id="btn4" onclick="selectShow(4)">大火</button>
      </div>
    </div>

    <div id="prizeWrap" style="position:absolute;inset:0;display:flex;visibility:hidden;align-items:center;justify-content:flex-end;flex-direction:column;gap:8px;pointer-events:none;opacity:0;transition:opacity .4s;padding-bottom:9%;">
      <img id="prizeCircleImg" src="effect/prize_circle.png" style="width:clamp(160px,20vw,260px);height:auto;">
      <div id="prizeAmtEl" style="color:#ffee44;font-size:clamp(20px,3vw,38px);font-weight:700;text-shadow:0 2px 12px #ff8800,0 1px 0 #a05000;font-family:sans-serif;letter-spacing:.04em;"></div>
    </div>
    <div class="ab" id="abtn" onclick="shoot()">
      <svg width="62%" viewBox="0 0 38 38" fill="none" stroke="#fff" stroke-linecap="round">
        <circle cx="19" cy="19" r="14" stroke-width="1.8" opacity=".6"/>
        <circle cx="19" cy="19" r="5.5" stroke-width="2.2"/>
        <line x1="19" y1="0" x2="19" y2="10" stroke-width="2.2"/>
        <line x1="19" y1="28" x2="19" y2="38" stroke-width="2.2"/>
        <line x1="0" y1="19" x2="10" y2="19" stroke-width="2.2"/>
        <line x1="28" y1="19" x2="38" y2="19" stroke-width="2.2"/>
      </svg>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// 常數設定
// ═══════════════════════════════════════════════════
const BASE_W=1600,BASE_H=640;
const DCX=198,DCY=155;
const TX_MIN=150,TX_MAX=1000,TY_MIN=-100,TY_MAX=200;
const D=0.707;
const DIRS=[{n:'E',dx:1,dy:0},{n:'NE',dx:D,dy:-D},{n:'N',dx:0,dy:-1},{n:'NW',dx:-D,dy:-D},{n:'W',dx:-1,dy:0},{n:'SW',dx:-D,dy:D},{n:'S',dx:0,dy:1},{n:'SE',dx:D,dy:D}];
const INF=[{sx:1,sy:1},{sx:1.45,sy:1.62},{sx:1.92,sy:2.18}];
const DEF=[{sx:1.92,sy:2.18,pw:1.0,lb:'噴火！'},{sx:1.45,sy:1.62,pw:0.755,lb:'還沒完！'},{sx:1.0,sy:1.0,pw:0.52,lb:'最後一噴！'}];
const MULS=[5,8,10,15,20,25,30,50];
const FSEG=[{rx:34,ry:16},{rx:30,ry:14},{rx:26,ry:12},{rx:22,ry:10},{rx:17,ry:8},{rx:13,ry:6},{rx:8,ry:4},{rx:4,ry:3}];
const FIRE_COLORS=['#ff3d00','#ff6200','#ff8500','#ffaa00','#ffcc00','#ffe040','#fff080','#fffacc'];
// ★ 嘴巴位置（相對 DCX/DCY 的 drawing context 座標，根據你的圖片調整）
const MOUTH_X=420, MOUTH_Y=115;
// 火焰延伸方向（往右，間距）
const FIRE_STEP=44;
// ── 下巴切割動畫
const HINGE_IMG_X=430, HINGE_IMG_Y=235;
// ── 正面噴火：嘴巴錨點（相對於正面龍圖片比例）
// 調整說明：0.5=水平正中, 0.4=40%高度處
// 往上調：把 S2_MOUTH_Y_RATIO 數字調小（如 0.4→0.35）
// 往下調：數字調大（如 0.4→0.45）
const S2_MOUTH_X_RATIO=0.5;   // 水平位置
const S2_MOUTH_Y_RATIO=0.48;  // 垂直位置（從頂部算）
// 數字顯示在火焰的哪個位置（0=最底, 負值=往上移）
const S2_NUM_OFFSET_Y=-70;    // 數字往上移
// ── 火焰圖片位置微調（相對於嘴巴錨點的額外偏移）
// S2_FIRE_OFFSET_Y：負數=往上，正數=往下
// S2_FIRE_OFFSET_X：負數=往左，正數=往右（目前以嘴巴X為中心）
const S2_FIRE_OFFSET_Y=-20;   // 預設往上20px，讓火焰從嘴巴噴出
const S2_FIRE_OFFSET_X=0;     // 水平偏移 // 鉸接點（圖片座標）
const JAW_IMG=[ // 下巴多邊形（圖片座標）
  [422,238],[475,270],[525,280],[511,309],
  [480,305],[451,289],[400,267],[401,244]
];
const JAW_MAX_ANGLE=26; // 最大張嘴角度（度）
const COIN_FPS=15, COIN_TOTAL=15;

// ═══════════════════════════════════════════════════
// 狀態
// ═══════════════════════════════════════════════════
let shots=0,busy=false,bet=999,rafId=null;
let showMode=1;
let s3Phase=null,s3FireScale=0,s3FadeT=0,s3CoinTimer=null;
let s2Phase=null,s2FireScale=0,s2FireIdx=0,s2ScoreDone=false;
let scoreVal=0,scoreFinal=0,scoreRafId=null;
let curTx=602,curTy=115,curAng=0;
let bellyScaleX=1,bellyScaleY=1;
let jawAngle=0; // 目前下巴張開角度（度）
let fireSegs=Array(8).fill(0);
let coins=[],coinImgs=[];
let dragonImgs=[],dragonImgLoaded=false;
let fireImg=null,prizeImg=null;
let prizeVal=0;
let currentDragonIdx=0; // 0=normal,1=belly1,2=belly2
let allCoins=[];
let scale=1;
let canvas,ctx,wrap;

// ═══════════════════════════════════════════════════
// 金幣圖片預載
// ═══════════════════════════════════════════════════
function loadPrize(){
  prizeImg=new Image();
  prizeImg.src='effect/prize_circle.png';
}

function loadFire(){
  fireImg=new Image();
  fireImg.src='effect/fire.png';
}
let frontDragonImgs=[],frontFireImgs=[];
function loadShow2Assets(){
  ['04','05'].forEach(n=>{const i=new Image();i.src='dragon/'+n+'.png';frontDragonImgs.push(i);});
  [2,3,4].forEach(n=>{const i=new Image();i.src='effect/fire0'+n+'.png';frontFireImgs.push(i);});
}

function loadDragon(){
  for(let i=1;i<=3;i++){
    const img=new Image();
    img.src='dragon/'+String(i).padStart(2,'0')+'.png';
    img.onload=()=>{if(dragonImgs.filter(x=>x.complete&&x.naturalWidth>0).length===3)dragonImgLoaded=true;};
    dragonImgs.push(img);
  }
}

function loadCoins(){
  let loaded=0;
  for(let i=1;i<=COIN_TOTAL;i++){
    const img=new Image();
    img.src='coins/C'+String(i).padStart(2,'0')+'.png';
    img.onload=()=>{loaded++;};
    coinImgs.push(img);
  }
}

// ═══════════════════════════════════════════════════
// 畫布縮放
// ═══════════════════════════════════════════════════
function resize(){
  const ww=window.innerWidth,wh=window.innerHeight;
  const s=Math.min(ww/BASE_W,wh/BASE_H);
  scale=s;
  wrap.style.width=BASE_W*s+'px';
  wrap.style.height=BASE_H*s+'px';
  canvas.width=BASE_W;
  canvas.height=BASE_H;
  canvas.style.width=BASE_W*s+'px';
  canvas.style.height=BASE_H*s+'px';
}

// ═══════════════════════════════════════════════════
// 龍的 SVG 路徑繪製（轉成 Canvas 版）
// ═══════════════════════════════════════════════════
function drawDragon(ctx){
  ctx.save();
  ctx.translate(DCX+curTx, DCY+curTy);
  ctx.rotate(curAng*Math.PI/180);
  ctx.scale(0.72,0.72);
  ctx.translate(-DCX,-DCY);

  const drImg=dragonImgs[currentDragonIdx];
  const iw=621,ih=402;
  const imgX=DCX-iw/2, imgY=DCY-ih/2;

  if(dragonImgLoaded && drImg && drImg.complete && drImg.naturalWidth>0){
    // ── 圖片座標轉繪圖座標的偏移
    const ox=imgX, oy=imgY;
    // 鉸接點在繪圖座標
    const hx=HINGE_IMG_X+ox, hy=HINGE_IMG_Y+oy;

    if(jawAngle>0.2){
      // ── Step1: 畫完整龍
      ctx.drawImage(drImg, imgX, imgY, iw, ih);
      // ── Step2: destination-out 擦掉下巴原始位置
      ctx.save();
      ctx.globalCompositeOperation='destination-out';
      jawCanvasPath(ctx,ox,oy);
      ctx.fill();
      ctx.restore();
      // ── Step3: 旋轉後畫下巴
      ctx.save();
      ctx.translate(hx,hy);
      ctx.rotate(jawAngle*Math.PI/180);
      ctx.translate(-hx,-hy);
      jawCanvasPath(ctx,ox,oy);
      ctx.clip();
      ctx.drawImage(drImg, imgX, imgY, iw, ih);
      ctx.restore();
    } else {
      // 閉嘴：直接畫完整圖片
      ctx.drawImage(drImg, imgX, imgY, iw, ih);
    }
  } else {
    // SVG fallback
    ctx.beginPath();ctx.ellipse(198,158,84,59,0,0,Math.PI*2);ctx.fillStyle='#7a2000';ctx.fill();
    ctx.save();
    ctx.translate(198,172);ctx.scale(bellyScaleX,bellyScaleY);ctx.translate(-198,-172);
    ctx.beginPath();ctx.ellipse(198,172,54,37,0,0,Math.PI*2);ctx.fillStyle='#c84a10';ctx.fill();
    ctx.restore();
    ctx.beginPath();ctx.ellipse(265,78,42,35,0,0,Math.PI*2);ctx.fillStyle='#8a2800';ctx.fill();
  }

  // 火焰（畫在龍上方）
  drawFireOnDragon(ctx);

  ctx.restore();
}

// 下巴多邊形路徑（偏移到繪圖座標）
function jawCanvasPath(ctx,ox,oy){
  ctx.beginPath();
  JAW_IMG.forEach(([x,y],i)=>i===0?ctx.moveTo(x+ox,y+oy):ctx.lineTo(x+ox,y+oy));
  ctx.closePath();
}

function drawFireOnDragon(ctx){
  // 整體 fire power = 第一段（最強段）決定整體大小
  const pow=fireSegs[0];
  if(pow<=0.01)return;
  if(!fireImg||!fireImg.complete||!fireImg.naturalWidth)return;

  const fw=643,fh=360;
  // 火焰左邊對齊嘴巴，垂直置中
  const fx=MOUTH_X;
  const fy=MOUTH_Y-fh/2;

  // 隨 power 縮放（全滿=1.0，洩完=0）
  // 以嘴巴為錨點縮放
  ctx.save();
  ctx.translate(MOUTH_X, MOUTH_Y);
  ctx.scale(pow, pow*0.85+0.15); // X縮放=power，Y稍微保留厚度
  ctx.globalAlpha=Math.min(1, pow*1.2);
  ctx.drawImage(fireImg, 0, -fh/2, fw, fh);
  ctx.globalAlpha=1;
  ctx.restore();
}

// ═══════════════════════════════════════════════════
// 金幣 Canvas 繪製
// ═══════════════════════════════════════════════════
function drawCoins(){
  const now=Date.now();
  allCoins.forEach(c=>{
    const frame=Math.floor((now-c.born)/(1000/COIN_FPS))%COIN_TOTAL;
    const img=coinImgs[frame];
    if(img && img.complete && img.naturalWidth>0){
      ctx.globalAlpha=c.alpha;
      ctx.drawImage(img,c.x-24,c.y-24,48,48);
      ctx.globalAlpha=1;
    } else {
      // fallback 圓形
      ctx.beginPath();ctx.arc(c.x,c.y,12,0,Math.PI*2);
      ctx.fillStyle='#ffd700';ctx.globalAlpha=c.alpha;ctx.fill();ctx.globalAlpha=1;
    }
  });
}

// ═══════════════════════════════════════════════════
// 主繪製迴圈
// ═══════════════════════════════════════════════════
function render(){
  ctx.clearRect(0,0,BASE_W,BASE_H);
  drawCoins();
  drawDragon(ctx);
  requestAnimationFrame(render);
}

// ═══════════════════════════════════════════════════
// 工具函數
// ═══════════════════════════════════════════════════
function eoq(t){return 1-(1-t)*(1-t);}
function eoc(t){return 1-Math.pow(1-t,3);}
function eiq(t){return t*t;}
function eob(t){const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}

function setDragon(tx,ty,ang){curTx=tx;curTy=ty;curAng=ang;}
function setBelly(sx,sy){
  bellyScaleX=sx;bellyScaleY=sy;
  // 同步切換龍的圖片階段
  if(sx>=1.85){currentDragonIdx=2;}       // belly2 (最滿)
  else if(sx>=1.3){currentDragonIdx=1;}   // belly1
  else{currentDragonIdx=0;}               // normal
}
function setFireSeg(i,pow){fireSegs[i]=pow;}
function setFire(pw,ts){
  FSEG.forEach((_,i)=>{
    const sp=Math.max(0,pw-i*.07),fk=ts?Math.sin(ts*.025+i*.9)*1.2:0;
    fireSegs[i]=Math.max(0,sp);
  });
}

function pickDir(lastN){
  const dist=100;
  let ok=DIRS.filter(d=>{
    if(d.n===lastN)return false;
    return curTx+d.dx*dist>=TX_MIN&&curTx+d.dx*dist<=TX_MAX&&curTy+d.dy*dist>=TY_MIN&&curTy+d.dy*dist<=TY_MAX;
  });
  if(!ok.length){
    ok=DIRS.filter(d=>d.n!==lastN);
    ok.sort((a,b)=>(Math.abs(curTx+a.dx*dist)+Math.abs(curTy+a.dy*dist))-(Math.abs(curTx+b.dx*dist)+Math.abs(curTy+b.dy*dist)));
  }
  return ok[Math.floor(Math.random()*ok.length)];
}

// 火焰尖端的世界座標（對應 f8 位置）
// 龍 local 座標 → 世界座標
function localToWorld(lx,ly){
  const ang=curAng*Math.PI/180;
  const dx=(lx-DCX)*0.72, dy=(ly-DCY)*0.72;
  return {
    x: DCX+curTx+Math.cos(ang)*dx-Math.sin(ang)*dy,
    y: DCY+curTy+Math.sin(ang)*dx+Math.cos(ang)*dy
  };
}

function spawnCoinsAlongFire(n){
  const now=Date.now();
  const FIRE_W=643; // fire.png 寬度
  for(let i=0;i<n;i++){
    // 沿火焰長度隨機取一點
    const t=0.1+Math.random()*0.9; // 從10%~100%位置散落
    const lx=MOUTH_X+t*FIRE_W;
    const ly=MOUTH_Y+(Math.random()-.5)*80; // 上下各40px散落
    const wp=localToWorld(lx,ly);
    allCoins.push({
      x: wp.x+(Math.random()-.5)*20,
      y: wp.y+(Math.random()-.5)*20,
      born: now+i*25,
      alpha: 1
    });
  }
}

function collectCoins(cb){
  const total=allCoins.length;
  if(!total){cb&&cb();return;}

  // 動態取得 ciEl（財產圖示）在畫面上的實際位置，換算回 canvas 座標
  const ciEl=document.getElementById('ciEl');
  const ciRect=ciEl.getBoundingClientRect();
  const wrapRect=wrap.getBoundingClientRect();
  // 相對於 wrap 的位置，再除以縮放比換回 canvas 座標
  const targetX=((ciRect.left-wrapRect.left)+ciRect.width/2)/scale;
  const targetY=((ciRect.top-wrapRect.top)+ciRect.height/2)/scale;

  allCoins.forEach((c,i)=>{
    setTimeout(()=>{
      const sx=c.x,sy=c.y;
      let t2=0;
      const mv=setInterval(()=>{
        t2+=0.06;const et=eoc(Math.min(t2,1));
        c.x=sx+(targetX-sx)*et;
        c.y=sy+(targetY-sy)*et;
        c.alpha=1-Math.min(t2,1);
        if(t2>=1){clearInterval(mv);}
      },16);
    },i*22);
  });
  setTimeout(()=>{allCoins=[];cb&&cb();},total*22+700);
}

// ═══════════════════════════════════════════════════
// 遊戲邏輯
// ═══════════════════════════════════════════════════
function shoot(){
  if(busy||shots>=8)return;
  shots++;
  if(shots===3){setBelly(INF[1].sx,INF[1].sy);setSt('肚子膨脹！');}
  else if(shots===5){setBelly(INF[2].sx,INF[2].sy);setSt('越來越大！快撐破了！');}
  else if(shots===8){
    busy=true;
    document.getElementById('abtn').style.opacity='.35';
    setSt('命中！');
    console.log('[Shoot] 命中！showMode='+showMode);
    if(showMode===1) setTimeout(startShow,200);
    else if(showMode===2) setTimeout(startShow2,200);
    else if(showMode===3) setTimeout(startShow3,200);
    else setTimeout(startShow4,200);
  }
  else setSt(['','命中！','再一發！','','撐著呢...','','快撐不住了！','最後一發！'][shots]);
}

function startShow(){
  let t0=null;
  function shake(ts){
    if(!t0)t0=ts;
    const t=(ts-t0)/380;
    setDragon(curTx+Math.sin(t*Math.PI*9)*9*(1-t),curTy,curAng);
    t<1?requestAnimationFrame(shake):runBursts();
  }
  requestAnimationFrame(shake);
}

function runBursts(){
  let lastN=null,bi=0,mulDone=false;
  function next(){
    if(bi>=DEF.length){
      if(!mulDone){mulDone=true;}
      setBelly(.88,.82);
      finishShow();
      return;
    }
    const stg=DEF[bi],dir=pickDir(lastN);lastN=dir.n;
    const fa=Math.atan2(-dir.dy,-dir.dx)*180/Math.PI;
    const dist=65+stg.pw*75;
    const dTx=Math.max(TX_MIN,Math.min(TX_MAX,curTx+dir.dx*dist));
    const dTy=Math.max(TY_MIN,Math.min(TY_MAX,curTy+dir.dy*dist));
    setBelly(stg.sx,stg.sy);
    curAng=fa;setDragon(curTx,curTy,curAng);setSt(stg.lb);
    const DUR=240+stg.pw*210,PAUSE=300+Math.random()*200;
    const sTx=curTx,sTy=curTy;let bS=null,coined=false;
    function tick(ts){
      if(!bS)bS=ts;
      const el=ts-bS,t=Math.min(el/DUR,1),et=eoc(t);
      curTx=sTx+(dTx-sTx)*et;curTy=sTy+(dTy-sTy)*et;
      setDragon(curTx,curTy,curAng+Math.sin(ts*.22)*2*(1-t));
      const fp=t<.35?eoq(t/.35)*stg.pw:t<.65?stg.pw:stg.pw*(1-eiq((t-.65)/.35));
      setFire(Math.max(0,fp),ts);
      if(t>.38&&t<.62&&!coined){coined=true;spawnCoinsAlongFire(4+Math.round(stg.pw*6));}
      if(t<1){rafId=requestAnimationFrame(tick);}
      else{curTx=dTx;curTy=dTy;setFire(0,null);setDragon(curTx,curTy,curAng);bi++;setTimeout(next,PAUSE);}
    }
    rafId=requestAnimationFrame(tick);
  }
  next();
}

function finishShow(){

  let t=0;const base=0.72;
  const bye=setInterval(()=>{
    t+=0.025;
    const s=t<0.28?base+base*0.45*(t/0.28):base*1.45*(1-(t-0.28)/0.72);
    window._dragonScale=Math.max(0,s);
    if(t>=1){
      clearInterval(bye);
      window._dragonScale=0;
      showMul(); // showMul 內部會先 collectCoins 再顯示獎圈
    }
  },16);
}

function render2(){

function drawShow2(ctx){
  // 正面龍圖（03=閉嘴, 04=張嘴）
  const iw=621,ih=402;
  const dx=Math.round(BASE_W/2-iw/2);
  const dy=Math.round(BASE_H*0.08);
  const useOpen=(s2Phase!=='closed'); // 只有閉嘴階段用03，其餘全程張嘴(04)
  const s2sc=window.s2DragonScale!==undefined?window.s2DragonScale:1;
  const drImg=frontDragonImgs[useOpen?1:0];
  if(!drImg||!drImg.complete||!drImg.naturalWidth){
    // 圖片未載入：畫提示框
    ctx.save();
    ctx.strokeStyle='#ff4444';ctx.lineWidth=2;
    ctx.strokeRect(dx,dy,iw,ih);
    ctx.fillStyle='#ff4444';ctx.font='16px monospace';ctx.textAlign='center';
    ctx.fillText('dragon/'+(useOpen?'04':'03')+'.png 未載入',dx+iw/2,dy+ih/2);
    ctx.restore();
  } else if(drImg&&drImg.complete&&drImg.naturalWidth){
    if(s2sc!==1&&s2sc>0){
      ctx.save();
      ctx.translate(dx+iw/2,dy+ih/2);
      ctx.scale(s2sc,s2sc);
      ctx.translate(-iw/2,-ih/2);
      ctx.drawImage(drImg,0,0,iw,ih);
      ctx.restore();
    } else if(s2sc>0){
      ctx.drawImage(drImg,dx,dy,iw,ih);
    }
  }

  // 火焰（嘴巴錨點：正面圖中央偏下）
  // 嘴巴大約在 iw*0.5, ih*0.68 的位置
  const mouthX=dx+iw*S2_MOUTH_X_RATIO;
  const mouthY=dy+ih*S2_MOUTH_Y_RATIO;

  if((s2Phase==='fire'||s2Phase==='fadeout')&&s2FireScale>0){
    const fImg=frontFireImgs[s2FireIdx];
    const fw=500,fh=448;
    const sc=s2FireScale;
    const alpha=s2Phase==='fadeout'?Math.max(0,1-s2FadeT):1;
    if(fImg&&fImg.complete&&fImg.naturalWidth){
      ctx.save();
      ctx.globalAlpha=alpha;
      ctx.drawImage(fImg, mouthX+S2_FIRE_OFFSET_X-fw*sc/2, mouthY+S2_FIRE_OFFSET_Y-fh*sc*0.5, fw*sc, fh*sc);
      ctx.globalAlpha=1;
      ctx.restore();
    }
    // 跑分數字在火焰中間
    if(scoreFinal>0){
      const t=scoreVal/scoreFinal;
      const sz=Math.round(52+t*88); // 52px→140px
      const numY=mouthY+fh*sc*0.18+S2_NUM_OFFSET_Y;
      ctx.save();
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.shadowColor='#ff6600';
      ctx.shadowBlur=sz*0.6;
      const grd=ctx.createLinearGradient(mouthX,numY-sz/2,mouthX,numY+sz/2);
      grd.addColorStop(0,'#ffffff');
      grd.addColorStop(0.35,'#ffee88');
      grd.addColorStop(1,'#ffaa00');
      ctx.font='bold '+sz+'px sans-serif';
      ctx.fillStyle=grd;
      ctx.fillText(scoreVal+'x', mouthX, numY);
      ctx.shadowBlur=0;
      ctx.restore();
    }
  }
}

let s2FadeT=0;

function startShow2(){
  console.log('[Show2] 開始表演2');
  scoreFinal=MULS[Math.floor(Math.random()*MULS.length)];
  scoreVal=0; s2Phase=null; s2FireScale=0; s2FireIdx=0; s2FadeT=0;

  // Step1: 龍飛到畫面中央
  const destTx=BASE_W/2-DCX, destTy=BASE_H*0.4-DCY;
  const sTx=curTx,sTy=curTy,sDur=500;
  console.log('[Show2] 龍飛往中央 destTx='+destTx+' destTy='+destTy);
  let t0=null;
  function flyIn(ts){
    if(!t0)t0=ts;
    const t=Math.min((ts-t0)/sDur,1),et=eoc(t);
    setDragon(sTx+(destTx-sTx)*et,sTy+(destTy-sTy)*et,curAng*(1-et));
    if(t<1)requestAnimationFrame(flyIn);
    else{
      setDragon(destTx,destTy,0);
      window._dragonScale=0;
      console.log('[Show2] 抵達中央，切換正面龍。frontDragonImgs loaded='+frontDragonImgs.filter(i=>i.complete&&i.naturalWidth>0).length+'/2');
      // Step2: 瞬切正面閉嘴
      s2Phase='closed'; setSt('');
      // 等 0.5秒 → 換張嘴 → 立即噴火
      setTimeout(()=>{
        s2Phase='open'; setSt('🔥');
        // 張嘴後立即開始噴火
        s2Phase='fire';
        runShow2Fire();
      },500);
    }
  }
  requestAnimationFrame(flyIn);
}

function runShow2Fire(){
  console.log('[Show2] 開始噴火，frontFireImgs loaded='+frontFireImgs.filter(i=>i.complete&&i.naturalWidth>0).length+'/3');
  const TOTAL=4000; // 噴火總時長 ms
  let t0=null;

  // 跑分在噴火開始500ms後啟動
  setTimeout(()=>runScore2(TOTAL-500),500);

  function fireTick(ts){
    if(!t0)t0=ts;
    const el=ts-t0,t=Math.min(el/TOTAL,1);
    // 火焰從0.05→1.5，先快後慢
    s2FireScale=0.05+eoc(t)*1.45;
    // 三段火焰圖切換
    s2FireIdx=t<0.35?0:t<0.7?1:2;
    if(t<1){requestAnimationFrame(fireTick);}
    else{
      // Step5: 跑分停止，火焰消失，龍縮小消失
      scoreVal=scoreFinal;
      if(scoreRafId){cancelAnimationFrame(scoreRafId);scoreRafId=null;}
      fadeOutFire(()=>{
        shrinkDragon2(()=>{
          // Step6: 獎圈（複用表演1的 showPrizeCircle）
          s2Phase=null;
          showPrizeCircle(scoreFinal);
          busy=false;
          document.getElementById('abtn').style.opacity='1';
        });
      });
    }
  }
  requestAnimationFrame(fireTick);
}

function runScore2(durationMs){
  if(scoreRafId)cancelAnimationFrame(scoreRafId);
  let t0=null;
  function tick(ts){
    if(!t0)t0=ts;
    const t=Math.min((ts-t0)/durationMs,1);
    // easeInOutQuad：前段衝快，後段慢慢靠近
    const et=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    scoreVal=Math.round(et*scoreFinal);
    if(t<1)scoreRafId=requestAnimationFrame(tick);
  }
  scoreRafId=requestAnimationFrame(tick);
}

function fadeOutFire(cb){
  console.log('[Show2] 火焰淡出');
  s2Phase='fadeout';
  let t0=null;
  function tick(ts){
    if(!t0)t0=ts;
    s2FadeT=Math.min((ts-t0)/600,1);
    if(s2FadeT<1)requestAnimationFrame(tick);
    else{s2FireScale=0;cb&&cb();}
  }
  requestAnimationFrame(tick);
}

function shrinkDragon2(cb){
  console.log('[Show2] 龍縮小消失');
  s2Phase='shrink';
  let t=0;
  const id=setInterval(()=>{
    t+=0.03;
    const s=t<0.25?1+0.45*(t/0.25):1.45*(1-(t-0.25)/0.75);
    window.s2DragonScale=Math.max(0,s);
    if(t>=1){clearInterval(id);window.s2DragonScale=0;cb&&cb();}
  },16);
}

// 表演3：噴小火

// 砲臺在底bar上方的嘴巴位置（相對 canvas 座標）
// 砲臺圖 608x299，水平置中，壓在底bar(約42px)上方
// 嘴巴大約在圖片上緣中央
function getTurretMouth(){
  const tw=Math.min(608, canvas.offsetWidth||BASE_W); // 砲臺顯示寬
  const th=tw*299/608;
  const tx=(BASE_W-tw)/2;
  const ty=BASE_H-42-th; // 底bar高度約42px
  // 嘴巴在砲臺圖上方約15%水平中央 → 調整 S3_MOUTH_X_RATIO / S3_MOUTH_Y_RATIO
  return {
    x: tx + tw * S3_MOUTH_X_RATIO,
    y: ty + th * S3_MOUTH_Y_RATIO,
    tw, th, tx, ty
  };
}
const S3_MOUTH_X_RATIO=0.5;  // 水平：0.5=正中
const S3_MOUTH_Y_RATIO=0.25; // 垂直：0=最上，往下加

function drawShow3(ctx){
  if(!s3Phase) return;
  if(s3Phase==='fire'){
    const m=getTurretMouth();
    const fw=500, fh=448;
    const scX=window.s3ScaleX||0;
    const scY=window.s3ScaleY||0;
    if(scX<=0&&scY<=0) return;

    if(fireImg&&fireImg.complete&&fireImg.naturalWidth){
      ctx.save();
      // 砲口為錨點，逆時針旋轉90度讓火焰朝上
      ctx.translate(m.x, m.y);
      ctx.rotate(-Math.PI/2);
      // scX=長度(上下), scY=寬度(左右) — 旋轉後對應 drawImage 的寬/高
      ctx.drawImage(fireImg,
        0,          // X：從砲口往右（旋轉後=往上）
        -fh*scY/2,  // Y：左右置中（旋轉後=左右）
        fw*scX,     // 寬=長度（旋轉後=火焰噴出高度）
        fh*scY      // 高=寬度（旋轉後=左右擴散寬度）
      );
      ctx.restore();
    }
  }
}

function startShow3(){
  scoreFinal=MULS[Math.floor(Math.random()*MULS.length)];
  scoreVal=0; s3Phase=null; s3FireScale=0; s3FadeT=0;

  // Step1: 側面龍縮小消失
  shrinkSideDragon(()=>{
    // Step2: 砲臺出現
    const tw=document.getElementById('s3TurretWrap');

    setSt('');
    // Step3: 0.5秒後開始噴火
    setTimeout(()=>{
      s3Phase='fire';
      runShow3Fire();
    }, 500);
  });
}

function shrinkSideDragon(cb){
  let t=0; const base=0.72;
  const id=setInterval(()=>{
    t+=0.03;
    const s=t<0.28?base+base*0.45*(t/0.28):base*1.45*(1-(t-0.28)/0.72);
    window._dragonScale=Math.max(0,s);
    if(t>=1){clearInterval(id);window._dragonScale=0;cb&&cb();}
  },16);
}

function runShow3Fire(){
  // ── 分段時間軸 (ms)
  const T_STRAIGHT = 800;   // 細直條
  const T_SPREAD   = 1700;  // 左右擴散
  const T_WOBBLE   = 700;   // 頂點抖動掙扎
  const T_EXTINGUISH = 350; // 急速熄滅（縮短，啪一下）
  const TOTAL = T_STRAIGHT + T_SPREAD + T_WOBBLE + T_EXTINGUISH;

  // scX = 火焰長度（上下），scY = 火焰寬度（左右）
  window.s3ScaleX = 1.0;
  window.s3ScaleY = 0.10;

  let t0=null, coinId=null;

  // 持續噴金幣
  coinId=setInterval(()=>{
    if(s3Phase!=='fire') return;
    const m=getTurretMouth();
    const fireLen=500*(window.s3ScaleX||1);
    for(let i=0;i<2;i++){
      allCoins.push({
        x: m.x+(Math.random()-.5)*80*(window.s3ScaleY||0.1),
        y: m.y - 30 - Math.random()*fireLen*0.7,
        born: Date.now(), alpha:1
      });
    }
  },220);

  function tick(ts){
    if(!t0)t0=ts;
    const el=ts-t0;

    if(el < T_STRAIGHT){
      // 階段1：細直條，固定
      window.s3ScaleX=1.0;
      window.s3ScaleY=0.10;

    } else if(el < T_STRAIGHT+T_SPREAD){
      // 階段2：左右擴散，easeIn（越來越快，製造蓄力感）
      const gt=(el-T_STRAIGHT)/T_SPREAD;
      const et=gt*gt; // easeIn
      window.s3ScaleX=1.0;
      window.s3ScaleY=0.10+et*0.80; // 0.10→0.90

    } else if(el < T_STRAIGHT+T_SPREAD+T_WOBBLE){
      // 階段3：頂點抖動，像在掙扎
      const wt=(el-T_STRAIGHT-T_SPREAD)/T_WOBBLE;
      window.s3ScaleX=1.0;
      window.s3ScaleY=0.90+Math.sin(wt*Math.PI*6)*0.08; // ±0.08 抖動

    } else {
      // 階段4：急速熄滅，easeIn（越來越快地消失）
      const et=(el-T_STRAIGHT-T_SPREAD-T_WOBBLE)/T_EXTINGUISH;
      const shrink=Math.max(0,1-et*et*et*et); // t^4：前段幾乎不動，最後瞬間歸零
      window.s3ScaleX=1.0*shrink;
      window.s3ScaleY=0.90*shrink;
    }

    if(el < TOTAL){
      requestAnimationFrame(tick);
    } else {
      clearInterval(coinId);
      window.s3ScaleX=0; window.s3ScaleY=0;
      s3Phase=null;
      // 砲臺留著，只收火焰
      collectCoins(()=>showPrizeCircle(scoreFinal));
      busy=false;
      document.getElementById('abtn').style.opacity='1';
    }
  }
  requestAnimationFrame(tick);
}

let s4Phase=null;

function drawShow4(ctx){
  if(!s4Phase) return;
  const m=getTurretMouth();
  const fw=500, fh=448;
  const scX=window.s4ScaleX||0;
  const scY=window.s4ScaleY||0;

  if(scX<=0&&scY<=0) return;

    ctx.save();
    ctx.globalAlpha=Math.min(1,alpha);
    ctx.translate(m.x, m.y);

    ctx.drawImage(fireImg,
      0,
      -fh*scY/2,
      fw*scX,
      fh*scY
    );

}

function runShow4Fire(){
  // ── 前半段時間軸（同噴小火）
  const T_STRAIGHT  = 800;
  const T_SPREAD    = 1700;
  const T_WOBBLE    = 700;
  // ── 後半段：覺醒成功
  const T_PAUSE     = 250;   // 假停頓：玩家以為要熄滅
  const T_BURST     = 400;   // 爆發放大：壓抑能量瞬間釋放
  const T_STRONG    = 2000;  // 強力抖動：覺醒持續燃燒
  const T_FADEOUT   = 1500;  // 淡出：成功的餘韻

  const TOTAL = T_STRAIGHT+T_SPREAD+T_WOBBLE+T_PAUSE+T_BURST+T_STRONG+T_FADEOUT;

  window.s4ScaleX=1.0; window.s4ScaleY=0.10; window.s4Alpha=1;
  let t0=null, coinId=null;

  coinId=setInterval(()=>{
    if(!s4Phase) return;
    const m=getTurretMouth();
    const scY=window.s4ScaleY||0.1;
    for(let i=0;i<3;i++){
      allCoins.push({
        x: m.x+(Math.random()-.5)*160*scY,
        y: m.y-30-Math.random()*500*(window.s4ScaleX||1)*0.7,
        born: Date.now(), alpha:1
      });
    }
  },180);

  function tick(ts){
    if(!t0) t0=ts;
    const el=ts-t0;

    if(el < T_STRAIGHT){
      // 細直條
      window.s4ScaleX=1.0; window.s4ScaleY=0.10;

    } else if(el < T_STRAIGHT+T_SPREAD){
      // 左右擴散 easeIn
      const gt=(el-T_STRAIGHT)/T_SPREAD;
      window.s4ScaleX=1.0;
      window.s4ScaleY=0.10+(gt*gt)*0.80;

    } else if(el < T_STRAIGHT+T_SPREAD+T_WOBBLE){
      // 頂點抖動
      const wt=(el-T_STRAIGHT-T_SPREAD)/T_WOBBLE;
      window.s4ScaleX=1.0;
      window.s4ScaleY=0.90+Math.sin(wt*Math.PI*6)*0.08;

    } else if(el < T_STRAIGHT+T_SPREAD+T_WOBBLE+T_PAUSE){
      // ★ 假停頓：火焰稍微縮小，讓玩家以為失敗
      const pt=(el-T_STRAIGHT-T_SPREAD-T_WOBBLE)/T_PAUSE;
      window.s4ScaleX=1.0-pt*0.15;      // 稍微縮短
      window.s4ScaleY=0.90-pt*0.15;     // 稍微收窄

    } else if(el < T_STRAIGHT+T_SPREAD+T_WOBBLE+T_PAUSE+T_BURST){
      // ★ 爆發：快速放大，壓抑能量釋放
      const bt=(el-T_STRAIGHT-T_SPREAD-T_WOBBLE-T_PAUSE)/T_BURST;
      const et=bt*bt*bt; // easeIn cubic：前慢後快
      window.s4ScaleX=0.85+et*0.55;     // 0.85→1.4
      window.s4ScaleY=0.75+et*2.05;     // 0.75→2.8

    } else if(el < T_STRAIGHT+T_SPREAD+T_WOBBLE+T_PAUSE+T_BURST+T_STRONG){
      // ★ 強力抖動：大幅震動，覺醒燃燒中
      const st=(el-T_STRAIGHT-T_SPREAD-T_WOBBLE-T_PAUSE-T_BURST)/T_STRONG;
      const wobble=Math.sin(st*Math.PI*14)*0.22; // 頻率快、幅度大
      const wobble2=Math.sin(st*Math.PI*9)*0.12;
      window.s4ScaleX=1.4+wobble2;
      window.s4ScaleY=2.8+wobble;

    } else {
      // ★ 淡出：alpha fade，火焰融入空氣消散
      const ft=(el-T_STRAIGHT-T_SPREAD-T_WOBBLE-T_PAUSE-T_BURST-T_STRONG)/T_FADEOUT;
      window.s4ScaleX=1.4;
      window.s4ScaleY=2.8;
      window.s4Alpha=Math.max(0,1-ft);
    }

    if(el < TOTAL){
      requestAnimationFrame(tick);
    } else {
      clearInterval(coinId);
      window.s4ScaleX=0; window.s4ScaleY=0; window.s4Alpha=0;
      s4Phase=null;
      collectCoins(()=>showPrizeCircle(scoreFinal));
      busy=false;
      document.getElementById('abtn').style.opacity='1';
    }
  }
  requestAnimationFrame(tick);
}

function resetGame(){
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  shots=0;busy=false;curTx=602;curTy=115;curAng=0;
  setBelly(1,1);setFire(0,null);currentDragonIdx=0;jawAngle=0;
  s2Phase=null;s2FireScale=0;s2FadeT=0;window.s2DragonScale=1;window._dragonScale=0.72;
  s3Phase=null;s3FireScale=0;window.s3ScaleX=0;window.s3ScaleY=0;window._s3scoreStarted=false;
  s4Phase=null;window.s4ScaleX=0;window.s4ScaleY=0;window.s4Alpha=1;
  scoreVal=0;scoreFinal=0;
  if(scoreRafId){cancelAnimationFrame(scoreRafId);scoreRafId=null;}
  const tw3=document.getElementById('s3TurretWrap');if(tw3)tw3.style.display='none';
  allCoins=[];
  window._dragonScale=0.72;

  document.getElementById('mulEl').style.opacity='0';
  document.getElementById('winEl').style.display='none';
  const pw=document.getElementById('prizeWrap');if(pw){pw.style.visibility='hidden';pw.style.opacity='0';}
  setSt('');
}
