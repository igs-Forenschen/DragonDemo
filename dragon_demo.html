<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>火龍表演模擬器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
#wrap{position:relative;overflow:hidden;}
#bgImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
#gameCanvas{position:absolute;inset:0;}
#hud{position:absolute;inset:0;pointer-events:none;}
#statusEl{position:absolute;top:1.8%;left:50%;transform:translateX(-50%);font-size:clamp(11px,1.4vw,16px);color:#ffd8a0;background:#00000066;padding:3px 14px;border-radius:20px;white-space:nowrap;font-family:sans-serif;}
#mulEl{position:absolute;left:0;right:0;top:32%;text-align:center;font-size:clamp(40px,7vw,80px);font-weight:700;color:#ffdd44;opacity:0;line-height:1;font-family:sans-serif;text-shadow:0 0 30px #ff8800,0 2px 0 #a05000;}
.bb{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:clamp(5px,1%,10px) clamp(10px,2%,20px);background:#000000bb;pointer-events:all;}
.cd{display:flex;align-items:center;gap:6px;color:#ffee88;font-size:clamp(11px,1.3vw,15px);font-family:sans-serif;}
.ci{width:clamp(16px,2vw,22px);height:clamp(16px,2vw,22px);border-radius:50%;background:#ffcc00;border:2px solid #ff8800;display:flex;align-items:center;justify-content:center;font-size:clamp(8px,1vw,11px);color:#7a4000;font-weight:700;}
.lv{font-size:clamp(9px,1vw,12px);color:#ffee8860;font-family:sans-serif;}
.br{display:flex;align-items:center;gap:6px;}
.bl{font-size:clamp(9px,1vw,12px);color:#ffee8860;font-family:sans-serif;}
.bbn{width:clamp(18px,2.2vw,26px);height:clamp(18px,2.2vw,26px);border-radius:50%;background:#333;border:1px solid #666;color:#fff;font-size:clamp(12px,1.6vw,18px);cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:all;}
.bv{font-size:clamp(12px,1.5vw,16px);font-weight:600;color:#ffee88;min-width:36px;text-align:center;font-family:sans-serif;}
.gb{position:absolute;left:clamp(6px,1.2%,14px);top:50%;transform:translateY(-50%);width:clamp(30px,4vw,42px);height:clamp(30px,4vw,42px);border-radius:50%;background:#00000088;border:1.5px solid #ffffff30;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:all;}
.ab{position:absolute;right:clamp(6px,1.2%,14px);top:50%;transform:translateY(-50%);width:clamp(44px,6.5vw,70px);height:clamp(44px,6.5vw,70px);border-radius:50%;background:#c84000ec;border:3px solid #ff8800;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:all;}
#winEl{display:none;font-size:clamp(13px,1.8vw,18px);font-weight:600;color:#ffee44;margin-left:8px;font-family:sans-serif;}
</style>
</head>
<body>
<div id="wrap">
  <img id="bgImg" src="background.png" alt="">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div id="statusEl"></div>
    <div id="mulEl"></div>
    <div id="turretWrap" style="position:absolute;bottom:var(--bbH,42px);left:50%;transform:translateX(-50%);width:clamp(180px,36vw,608px);pointer-events:none;display:none;z-index:6;"><img src="dragon/06.png" style="width:100%;height:auto;display:block;"></div>
    <div class="bb">
      <span class="lv">LV.C3065 SU</span>
      <div class="cd">
        <div class="ci" id="ciEl">$</div>

        <span id="winEl"></span>
      </div>
      <div class="br">
        <span class="bl">BET</span>
        <button class="bbn" onclick="chgBet(-1)">-</button>
        <span class="bv" id="bval">999</span>
        <button class="bbn" onclick="chgBet(1)">+</button>

      <img id="prizeCircleImg" src="effect/prize_circle.png" style="width:clamp(160px,20vw,260px);height:auto;">
      <div id="prizeAmtEl" style="color:#ffee44;font-size:clamp(20px,3vw,38px);font-weight:700;text-shadow:0 2px 12px #ff8800,0 1px 0 #a05000;font-family:sans-serif;letter-spacing:.04em;"></div>
    </div>
    <div style="position:absolute;right:clamp(6px,1.2%,14px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:all;">
      <div class="ab" id="abtn" onclick="shoot()" style="position:static;transform:none;">
        <svg width="62%" viewBox="0 0 38 38" fill="none" stroke="#fff" stroke-linecap="round">
          <circle cx="19" cy="19" r="14" stroke-width="1.8" opacity=".6"/>
          <circle cx="19" cy="19" r="5.5" stroke-width="2.2"/>
          <line x1="19" y1="0" x2="19" y2="10" stroke-width="2.2"/>
          <line x1="19" y1="28" x2="19" y2="38" stroke-width="2.2"/>
          <line x1="0" y1="19" x2="10" y2="19" stroke-width="2.2"/>
          <line x1="28" y1="19" x2="38" y2="19" stroke-width="2.2"/>
        </svg>
      </div>
      <div onclick="resetGame()" title="重置" style="width:clamp(26px,3.5vw,38px);height:clamp(26px,3.5vw,38px);border-radius:50%;background:#00000088;border:1.5px solid #ffffff30;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="55%" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// 常數設定
// ═══════════════════════════════════════════════════
const BASE_W=1600,BASE_H=640;
const DCX=198,DCY=155;
const TX_MIN=150,TX_MAX=1000,TY_MIN=-100,TY_MAX=200;
const D=0.707;
const DIRS=[{n:'E',dx:1,dy:0},{n:'NE',dx:D,dy:-D},{n:'N',dx:0,dy:-1},{n:'NW',dx:-D,dy:-D},{n:'W',dx:-1,dy:0},{n:'SW',dx:-D,dy:D},{n:'S',dx:0,dy:1},{n:'SE',dx:D,dy:D}];
const INF=[{sx:1,sy:1},{sx:1.45,sy:1.62},{sx:1.92,sy:2.18}];
const DEF=[{sx:1.92,sy:2.18,pw:1.0,lb:'噴火！'},{sx:1.45,sy:1.62,pw:0.755,lb:'還沒完！'},{sx:1.0,sy:1.0,pw:0.52,lb:'最後一噴！'}];
const MULS=[5,8,10,15,20,25,30,50];
const FSEG=[{rx:34,ry:16},{rx:30,ry:14},{rx:26,ry:12},{rx:22,ry:10},{rx:17,ry:8},{rx:13,ry:6},{rx:8,ry:4},{rx:4,ry:3}];
const FIRE_COLORS=['#ff3d00','#ff6200','#ff8500','#ffaa00','#ffcc00','#ffe040','#fff080','#fffacc'];
// ★ 嘴巴位置（相對 DCX/DCY 的 drawing context 座標，根據你的圖片調整）
const MOUTH_X=420, MOUTH_Y=115;
// 火焰延伸方向（往右，間距）
const FIRE_STEP=44;
// ── 下巴切割動畫
const HINGE_IMG_X=430, HINGE_IMG_Y=235;
// 往上調：把 S2_MOUTH_Y_RATIO 數字調小（如 0.4→0.35）
// 往下調：數字調大（如 0.4→0.45）
// 數字顯示在火焰的哪個位置（0=最底, 負值=往上移）
// ── 火焰圖片位置微調（相對於嘴巴錨點的額外偏移）
const JAW_IMG=[ // 下巴多邊形（圖片座標）
  [422,238],[475,270],[525,280],[511,309],
  [480,305],[451,289],[400,267],[401,244]
];
const JAW_MAX_ANGLE=26; // 最大張嘴角度（度）
const COIN_FPS=15, COIN_TOTAL=15;

// ═══════════════════════════════════════════════════
// 狀態
// ═══════════════════════════════════════════════════
let shots=0,busy=false,bet=999,rafId=null;
let showMode=1;

// ── 隨機表演數值（可調整）──────────────────────
// 小火
const R_SS=[3,4,5,6],  R_SSW=[32,25,12,4];
const R_SM=[30,50,80],  R_SMW=[38,20,12];
const R_GATHER_S=1500;   // 小火聚集時間 ms
// 大火
const R_BS=[1,2,3],    R_BSW=[35,25,15];
const R_BM=[100,200,300,600], R_BMW=[60,45,20,5];
const R_GATHER_B=3000;   // 大火聚集時間 ms
// fire_frame 位置（相對 canvas 座標）
const FF_X=BASE_W*0.62;  // 水平：往左減、往右加
const FF_Y=BASE_H*0.88;  // 垂直：往上減、往下加
// ────────────────────────────────────────────────

// 隨機表演狀態
let rPhase=null, rFireSeq=[], rIdx=0;
let rScoreVal=0, rScoreFinal=0, rScoreActive=false;
let rFrameAlpha=0; // fire_frame 淡入
let turretPhase=null;
let gatherRaf=null,fireRaf=null;
let tScaleX=1,tScaleY=1,tAlpha=0;
// 火球聚集位置（相對canvas座標，可調整）
const GATHER_X=BASE_W/2;  // 水平：畫面正中
const GATHER_Y_RATIO=0.6; // 垂直：佔畫面高度比例，往下加大
let scoreVal=0,scoreFinal=0,scoreRafId=null;
let curTx=602,curTy=115,curAng=0;
let bellyScaleX=1,bellyScaleY=1;
let jawAngle=0; // 目前下巴張開角度（度）
let fireSegs=Array(8).fill(0);
let coins=[],coinImgs=[];
let dragonImgs=[],dragonImgLoaded=false;
let fireImg=null,prizeImg=null;
let prizeVal=0;
let currentDragonIdx=0; // 0=normal,1=belly1,2=belly2
let allCoins=[];
let scale=1;
let canvas,ctx,wrap;

// ═══════════════════════════════════════════════════
// 金幣圖片預載
// ═══════════════════════════════════════════════════
function loadPrize(){
  prizeImg=new Image();
  prizeImg.src='effect/prize_circle.png';
}
let fireFrameImg=null;
function loadFireFrame(){
  fireFrameImg=new Image();
  fireFrameImg.src='UI/fire_frame.png';
}

function loadFire(){
  fireImg=new Image();
  fireImg.src='effect/fire.png';
}
function loadShow2Assets(){
  ['04','05'].forEach(n=>{const i=new Image();i.src='dragon/'+n+'.png';frontDragonImgs.push(i);});
  [2,3,4].forEach(n=>{const i=new Image();i.src='effect/fire0'+n+'.png';frontFireImgs.push(i);});
}

function loadDragon(){
  for(let i=1;i<=3;i++){
    const img=new Image();
    img.src='dragon/'+String(i).padStart(2,'0')+'.png';
    img.onload=()=>{if(dragonImgs.filter(x=>x.complete&&x.naturalWidth>0).length===3)dragonImgLoaded=true;};
    dragonImgs.push(img);
  }
}

function loadCoins(){
  let loaded=0;
  for(let i=1;i<=COIN_TOTAL;i++){
    const img=new Image();
    img.src='coins/C'+String(i).padStart(2,'0')+'.png';
    img.onload=()=>{loaded++;};
    coinImgs.push(img);
  }
}

// ═══════════════════════════════════════════════════
// 畫布縮放
// ═══════════════════════════════════════════════════
function resize(){
  const ww=window.innerWidth,wh=window.innerHeight;
  const s=Math.min(ww/BASE_W,wh/BASE_H);
  scale=s;
  wrap.style.width=BASE_W*s+'px';
  wrap.style.height=BASE_H*s+'px';
  canvas.width=BASE_W;
  canvas.height=BASE_H;
  canvas.style.width=BASE_W*s+'px';
  canvas.style.height=BASE_H*s+'px';
}

// ═══════════════════════════════════════════════════
// 龍的 SVG 路徑繪製（轉成 Canvas 版）
// ═══════════════════════════════════════════════════
function drawDragon(ctx){
  ctx.save();
  ctx.translate(DCX+curTx, DCY+curTy);
  ctx.rotate(curAng*Math.PI/180);
  ctx.scale(0.72,0.72);
  ctx.translate(-DCX,-DCY);

  const drImg=dragonImgs[currentDragonIdx];
  const iw=621,ih=402;
  const imgX=DCX-iw/2, imgY=DCY-ih/2;

  if(dragonImgLoaded && drImg && drImg.complete && drImg.naturalWidth>0){
    // ── 圖片座標轉繪圖座標的偏移
    const ox=imgX, oy=imgY;
    // 鉸接點在繪圖座標
    const hx=HINGE_IMG_X+ox, hy=HINGE_IMG_Y+oy;

    if(jawAngle>0.2){
      // ── Step1: 畫完整龍
      ctx.drawImage(drImg, imgX, imgY, iw, ih);
      // ── Step2: destination-out 擦掉下巴原始位置
      ctx.save();
      ctx.globalCompositeOperation='destination-out';
      jawCanvasPath(ctx,ox,oy);
      ctx.fill();
      ctx.restore();
      // ── Step3: 旋轉後畫下巴
      ctx.save();
      ctx.translate(hx,hy);
      ctx.rotate(jawAngle*Math.PI/180);
      ctx.translate(-hx,-hy);
      jawCanvasPath(ctx,ox,oy);
      ctx.clip();
      ctx.drawImage(drImg, imgX, imgY, iw, ih);
      ctx.restore();
    } else {
      // 閉嘴：直接畫完整圖片
      ctx.drawImage(drImg, imgX, imgY, iw, ih);
    }
  } else {
    // SVG fallback
    ctx.beginPath();ctx.ellipse(198,158,84,59,0,0,Math.PI*2);ctx.fillStyle='#7a2000';ctx.fill();
    ctx.save();
    ctx.translate(198,172);ctx.scale(bellyScaleX,bellyScaleY);ctx.translate(-198,-172);
    ctx.beginPath();ctx.ellipse(198,172,54,37,0,0,Math.PI*2);ctx.fillStyle='#c84a10';ctx.fill();
    ctx.restore();
    ctx.beginPath();ctx.ellipse(265,78,42,35,0,0,Math.PI*2);ctx.fillStyle='#8a2800';ctx.fill();
  }

  // 火焰（畫在龍上方）
  drawFireOnDragon(ctx);

  ctx.restore();
}

// 下巴多邊形路徑（偏移到繪圖座標）
function jawCanvasPath(ctx,ox,oy){
  ctx.beginPath();
  JAW_IMG.forEach(([x,y],i)=>i===0?ctx.moveTo(x+ox,y+oy):ctx.lineTo(x+ox,y+oy));
  ctx.closePath();
}

function drawFireOnDragon(ctx){
  // 整體 fire power = 第一段（最強段）決定整體大小
  const pow=fireSegs[0];
  if(pow<=0.01)return;
  if(!fireImg||!fireImg.complete||!fireImg.naturalWidth)return;

  const fw=643,fh=360;
  // 火焰左邊對齊嘴巴，垂直置中
  const fx=MOUTH_X;
  const fy=MOUTH_Y-fh/2;

  // 隨 power 縮放（全滿=1.0，洩完=0）
  // 以嘴巴為錨點縮放
  ctx.save();
  ctx.translate(MOUTH_X, MOUTH_Y);
  ctx.scale(pow, pow*0.85+0.15); // X縮放=power，Y稍微保留厚度
  ctx.globalAlpha=Math.min(1, pow*1.2);
  ctx.drawImage(fireImg, 0, -fh/2, fw, fh);
  ctx.globalAlpha=1;
  ctx.restore();
}

// ═══════════════════════════════════════════════════
// 金幣 Canvas 繪製
// ═══════════════════════════════════════════════════
function drawCoins(){
  const now=Date.now();
  allCoins.forEach(c=>{
    const frame=Math.floor((now-c.born)/(1000/COIN_FPS))%COIN_TOTAL;
    const img=coinImgs[frame];
    if(img && img.complete && img.naturalWidth>0){
      ctx.globalAlpha=c.alpha;
      ctx.drawImage(img,c.x-24,c.y-24,48,48);
      ctx.globalAlpha=1;
    } else {
      // fallback 圓形
      ctx.beginPath();ctx.arc(c.x,c.y,12,0,Math.PI*2);
      ctx.fillStyle='#ffd700';ctx.globalAlpha=c.alpha;ctx.fill();ctx.globalAlpha=1;
    }
  });
}

// ═══════════════════════════════════════════════════
// 主繪製迴圈
// ═══════════════════════════════════════════════════
function render(){
  ctx.clearRect(0,0,BASE_W,BASE_H);
  drawCoins();
  drawDragon(ctx);
  requestAnimationFrame(render);
}

// ═══════════════════════════════════════════════════
// 工具函數
// ═══════════════════════════════════════════════════
function eoq(t){return 1-(1-t)*(1-t);}
function eoc(t){return 1-Math.pow(1-t,3);}
function eiq(t){return t*t;}
function eob(t){const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}

function setDragon(tx,ty,ang){curTx=tx;curTy=ty;curAng=ang;}
function setBelly(sx,sy){
  bellyScaleX=sx;bellyScaleY=sy;
  // 同步切換龍的圖片階段
  if(sx>=1.85){currentDragonIdx=2;}       // belly2 (最滿)
  else if(sx>=1.3){currentDragonIdx=1;}   // belly1
  else{currentDragonIdx=0;}               // normal
}
function setFireSeg(i,pow){fireSegs[i]=pow;}
function setFire(pw,ts){
  FSEG.forEach((_,i)=>{
    const sp=Math.max(0,pw-i*.07),fk=ts?Math.sin(ts*.025+i*.9)*1.2:0;
    fireSegs[i]=Math.max(0,sp);
  });
}

function pickDir(lastN){
  const dist=100;
  let ok=DIRS.filter(d=>{
    if(d.n===lastN)return false;
    return curTx+d.dx*dist>=TX_MIN&&curTx+d.dx*dist<=TX_MAX&&curTy+d.dy*dist>=TY_MIN&&curTy+d.dy*dist<=TY_MAX;
  });
  if(!ok.length){
    ok=DIRS.filter(d=>d.n!==lastN);
    ok.sort((a,b)=>(Math.abs(curTx+a.dx*dist)+Math.abs(curTy+a.dy*dist))-(Math.abs(curTx+b.dx*dist)+Math.abs(curTy+b.dy*dist)));
  }
  return ok[Math.floor(Math.random()*ok.length)];
}

// 火焰尖端的世界座標（對應 f8 位置）
// 龍 local 座標 → 世界座標
function localToWorld(lx,ly){
  const ang=curAng*Math.PI/180;
  const dx=(lx-DCX)*0.72, dy=(ly-DCY)*0.72;
  return {
    x: DCX+curTx+Math.cos(ang)*dx-Math.sin(ang)*dy,
    y: DCY+curTy+Math.sin(ang)*dx+Math.cos(ang)*dy
  };
}

function spawnCoinsAlongFire(n){
  const now=Date.now();
  const FIRE_W=643; // fire.png 寬度
  for(let i=0;i<n;i++){
    // 沿火焰長度隨機取一點
    const t=0.1+Math.random()*0.9; // 從10%~100%位置散落
    const lx=MOUTH_X+t*FIRE_W;
    const ly=MOUTH_Y+(Math.random()-.5)*80; // 上下各40px散落
    const wp=localToWorld(lx,ly);
    allCoins.push({
      x: wp.x+(Math.random()-.5)*20,
      y: wp.y+(Math.random()-.5)*20,
      born: now+i*25,
      alpha: 1
    });
  }
}

// 金幣飛向 fire_frame（隨機表演用）
function collectCoinsToFrame(cb){
  const total=allCoins.length;
  if(!total){cb&&cb();return;}
  // 目標 = fire_frame 中心（FF_X, FF_Y 都是 canvas 座標）
  const targetX=FF_X;
  const targetY=FF_Y;
  allCoins.forEach(function(c,i){
    setTimeout(function(){
      const sx=c.x,sy=c.y;
      let t2=0;
      const mv=setInterval(function(){
        t2+=0.07;const et=1-Math.pow(1-Math.min(t2,1),3);
        c.x=sx+(targetX-sx)*et;
        c.y=sy+(targetY-sy)*et;
        c.alpha=1-Math.min(t2,1);
        if(t2>=1)clearInterval(mv);
      },16);
    },i*22);
  });
  setTimeout(function(){allCoins=[];cb&&cb();},total*22+500);
}

function collectCoins(cb){
  const total=allCoins.length;
  if(!total){cb&&cb();return;}

  // 動態取得 ciEl（財產圖示）在畫面上的實際位置，換算回 canvas 座標
  const ciEl=document.getElementById('ciEl');
  const ciRect=ciEl.getBoundingClientRect();
  const wrapRect=wrap.getBoundingClientRect();
  // 相對於 wrap 的位置，再除以縮放比換回 canvas 座標
  const targetX=((ciRect.left-wrapRect.left)+ciRect.width/2)/scale;
  const targetY=((ciRect.top-wrapRect.top)+ciRect.height/2)/scale;

  allCoins.forEach((c,i)=>{
    setTimeout(()=>{
      const sx=c.x,sy=c.y;
      let t2=0;
      const mv=setInterval(()=>{
        t2+=0.06;const et=eoc(Math.min(t2,1));
        c.x=sx+(targetX-sx)*et;
        c.y=sy+(targetY-sy)*et;
        c.alpha=1-Math.min(t2,1);
        if(t2>=1){clearInterval(mv);}
      },16);
    },i*22);
  });
  setTimeout(()=>{allCoins=[];cb&&cb();},total*22+700);
}

function runBursts(){
  let lastN=null,bi=0,mulDone=false;
  function next(){
    if(bi>=DEF.length){
      if(!mulDone){mulDone=true;}
      setBelly(.88,.82);
      finishShow();
      return;
    }
    const stg=DEF[bi],dir=pickDir(lastN);lastN=dir.n;
    const fa=Math.atan2(-dir.dy,-dir.dx)*180/Math.PI;
    const dist=65+stg.pw*75;
    const dTx=Math.max(TX_MIN,Math.min(TX_MAX,curTx+dir.dx*dist));
    const dTy=Math.max(TY_MIN,Math.min(TY_MAX,curTy+dir.dy*dist));
    setBelly(stg.sx,stg.sy);
    curAng=fa;setDragon(curTx,curTy,curAng);setSt(stg.lb);
    const DUR=240+stg.pw*210,PAUSE=300+Math.random()*200;
    const sTx=curTx,sTy=curTy;let bS=null,coined=false;
    function tick(ts){
      if(!bS)bS=ts;
      const el=ts-bS,t=Math.min(el/DUR,1),et=eoc(t);
      curTx=sTx+(dTx-sTx)*et;curTy=sTy+(dTy-sTy)*et;
      setDragon(curTx,curTy,curAng+Math.sin(ts*.22)*2*(1-t));
      const fp=t<.35?eoq(t/.35)*stg.pw:t<.65?stg.pw:stg.pw*(1-eiq((t-.65)/.35));
      setFire(Math.max(0,fp),ts);
      if(t>.38&&t<.62&&!coined){coined=true;spawnCoinsAlongFire(4+Math.round(stg.pw*6));}
      if(t<1){rafId=requestAnimationFrame(tick);}
      else{curTx=dTx;curTy=dTy;setFire(0,null);setDragon(curTx,curTy,curAng);bi++;setTimeout(next,PAUSE);}
    }
    rafId=requestAnimationFrame(tick);
  }
  next();
}

// ══════════════════════════
// 火球能量聚集粒子系統
// ══════════════════════════
let gParticles=[];
const GCOLS=['#ff4400','#ff7700','#ffaa00','#ffcc44','#ff2200','#ff8800','#ffdd00'];

function mkGParticle(cx,cy){
  const angle=Math.random()*Math.PI*2;
  const dist=90+Math.random()*160;
  return {
    x:cx+Math.cos(angle)*dist, y:cy+Math.sin(angle)*dist,
    vx:0, vy:0, size:1+Math.random()*2,
    color:GCOLS[Math.floor(Math.random()*GCOLS.length)],
    alpha:0.6+Math.random()*0.4, trail:[]
  };
}

function updateGather(cx,cy,coreR){
  for(let i=gParticles.length-1;i>=0;i--){
    const p=gParticles[i];
    p.trail.push({x:p.x,y:p.y,a:p.alpha});
    if(p.trail.length>7) p.trail.shift();
    const dx=cx-p.x, dy=cy-p.y;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    const force=5*(80/Math.max(dist,8));
    p.vx+=dx/dist*force*0.04;
    p.vy+=dy/dist*force*0.04;
    p.x+=p.vx; p.y+=p.vy;
    if(dist<coreR+4) gParticles[i]=mkGParticle(cx,cy);
  }
  while(gParticles.length<70) gParticles.push(mkGParticle(cx,cy));
}

function drawGather(ctx,cx,cy,coreR,pulseT){
  // 粒子
  for(const p of gParticles){
    for(let t=0;t<p.trail.length;t++){
      const tr=p.trail[t],tf=t/p.trail.length;
      ctx.save();ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=tr.a*tf*0.4;
      ctx.beginPath();ctx.arc(tr.x,tr.y,p.size*tf,0,Math.PI*2);
      ctx.fillStyle=p.color;ctx.fill();ctx.restore();
    }
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=p.alpha;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle=p.color;ctx.fill();ctx.restore();
  }
  // 核心火球
  const pulse=Math.sin(pulseT)*2.5, r=coreR+pulse;
  const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,r*2.6);
  glow.addColorStop(0,'rgba(255,200,80,0.55)');
  glow.addColorStop(0.4,'rgba(255,80,0,0.28)');
  glow.addColorStop(1,'rgba(255,30,0,0)');
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.beginPath();ctx.arc(cx,cy,r*2.6,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();
  const core=ctx.createRadialGradient(cx-r*0.2,cy-r*0.2,0,cx,cy,r);
  core.addColorStop(0,'rgba(255,255,220,1)');
  core.addColorStop(0.35,'rgba(255,180,60,0.95)');
  core.addColorStop(0.75,'rgba(255,70,10,0.85)');
  core.addColorStop(1,'rgba(180,20,0,0.6)');
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=core;ctx.fill();
  ctx.restore();
  // 旋轉光環
  const ra=pulseT*0.9;
  for(let i=0;i<3;i++){
    const a=ra+i*Math.PI*2/3;
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.5;
    ctx.beginPath();ctx.arc(cx+Math.cos(a)*r*1.45,cy+Math.sin(a)*r*1.45,r*0.28,0,Math.PI*2);
    ctx.fillStyle='rgba(255,160,50,0.55)';ctx.fill();ctx.restore();
  }
}

// ══════════════════════════
// 隨機表演
// ══════════════════════════
function rWr(v,w){
  var t=0,i;for(i=0;i<w.length;i++)t+=w[i];
  var r=Math.random()*t;
  for(i=0;i<v.length;i++){r-=w[i];if(r<=0)return v[i];}
  return v[v.length-1];
}

function startShowRandom(){
  // 決定次數
  var ss=rWr(R_SS,R_SSW);
  var bs=rWr(R_BS,R_BSW);
  // 決定各發倍率
  var fires=[];
  var i,mul;
  for(i=0;i<ss;i++){mul=rWr(R_SM,R_SMW);fires.push({type:'small',mul:mul});}
  for(i=0;i<bs;i++){mul=rWr(R_BM,R_BMW);fires.push({type:'big',mul:mul});}
  // 打亂（Fisher-Yates shuffle）
  for(i=fires.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=fires[i];fires[i]=fires[j];fires[j]=tmp;
  }
  rFireSeq=fires;
  rIdx=0;
  rScoreFinal=fires.reduce(function(a,f){return a+f.mul;},0);
  rScoreVal=0; rScoreActive=true; rFrameAlpha=0; rPhase='running';
  setSt('');
  shrinkSideDragon(function(){
    var tw=document.getElementById('turretWrap');
    if(tw)tw.style.display='block';
    // 面板立即淡入
    var t0=null;
    function ffFadeIn(ts){
      if(!t0)t0=ts;
      rFrameAlpha=Math.min(1,(ts-t0)/300);
      if(rFrameAlpha<1)requestAnimationFrame(ffFadeIn);
      else{rFrameAlpha=1;setTimeout(runNextFire,200);}
    }
    requestAnimationFrame(ffFadeIn);
  });
}

function runNextFire(){
  if(rIdx>=rFireSeq.length){
    // 所有噴火完畢，面板已顯示，跑分已完成
    rPhase=null;
    setFire(0,null);
    setTimeout(function(){
      rScoreActive=false; rFrameAlpha=0;
      busy=false;
      document.getElementById('abtn').style.opacity='1';
      setSt('獲得 '+rScoreFinal+'x！');
    },2500);
    return;
  }
  var fire=rFireSeq[rIdx];
  var isBig=(fire.type==='big');
  var gatherDur=isBig?R_GATHER_B:R_GATHER_S;
  var tScaleYNow=isBig?2.0:1.0;
  setSt(isBig?'大火！':'小火');

  // 聚集動畫
  var gx=GATHER_X, gy=BASE_H*GATHER_Y_RATIO;
  var CORER_START2=14, CORER_END2=isBig?52:34;
  turretPhase='gather';
  gParticles=[];
  var pulseT=0,t0=null;
  function gatherTick(ts){
    if(!t0)t0=ts;
    pulseT+=0.04;
    var gt=Math.min((ts-t0)/gatherDur,1);
    var et=1-Math.pow(1-gt,2);
    var coreR=CORER_START2+(CORER_END2-CORER_START2)*et;
    window._gatherCX=gx;window._gatherCY=gy;
    window._gatherPulse=pulseT;window._gatherR=coreR;
    updateGather(gx,gy,coreR);
    if(ts-t0<gatherDur)requestAnimationFrame(gatherTick);
    else{
      turretPhase='fire';
      gParticles=[];window._gatherCX=null;
      runFireSegment(isBig,tScaleYNow,fire.mul);
    }
  }
  requestAnimationFrame(gatherTick);
}

function runFireSegment(isBig,scY,mul){
  var FIRE_DUR=isBig?1600:900;
  tScaleX=1.0;tScaleY=scY;tAlpha=1;
  var t0=null,coined=false;
  function tick(ts){
    if(!t0)t0=ts;
    var el=ts-t0,t=Math.min(el/FIRE_DUR,1);
    tAlpha=t<0.75?1:1-(t-0.75)/0.25;
    setFire(Math.max(0,tAlpha*0.4),ts);
    if(t>0.3&&!coined){
      coined=true;
      spawnCoinsRandom(isBig,mul);
    }
    if(t<1){
      requestAnimationFrame(tick);
    } else {
      tAlpha=0;tScaleX=0;tScaleY=0;
      turretPhase=null;setFire(0,null);
      // 噴完後：金幣飛向 fire_frame 面板，同時累加跑分
      collectCoinsToFrame(function(){
        // 跑分累加（從目前值跑到加上本次 mul）
        var fromVal=rScoreVal;
        var toVal=rScoreVal+mul;
        var dur=400;var t0s=null;
        function scoreUp(ts){
          if(!t0s)t0s=ts;
          var st=Math.min((ts-t0s)/dur,1);
          var et=1-(1-st)*(1-st);
          rScoreVal=Math.round(fromVal+(toVal-fromVal)*et);
          if(st<1)requestAnimationFrame(scoreUp);
          else{
            rScoreVal=toVal;
            rIdx++;
            setTimeout(runNextFire,isBig?300:150);
          }
        }
        requestAnimationFrame(scoreUp);
      });
    }
  }
  requestAnimationFrame(tick);
}

function spawnCoinsRandom(isBig,mul){
  // 使用跟 allCoins 一樣的 canvas 物件格式 {x, y, born, alpha}
  var gx=GATHER_X, gy=BASE_H*GATHER_Y_RATIO;
  var ae=document.querySelector('.ar');
  var aW=ae?ae.offsetWidth:600, aH=ae?ae.offsetHeight:320;
  var svgH=aW*258/620;
  // 砲口換算成 canvas 座標
  var cx=gx/620*aW;
  var cy=(aH-svgH)+gy/258*svgH;
  var n=isBig?Math.ceil(mul/80):Math.ceil(mul/30);
  n=Math.min(Math.max(n,2),12);
  var spread=isBig?60:35;
  var now=Date.now();
  for(var i=0;i<n;i++){
    allCoins.push({
      x: cx+(Math.random()-.5)*spread,
      y: cy-80-Math.random()*80,   // 往砲口上方散落
      born: now+i*35,
      alpha: 1
    });
  }
}

function startRScore(){
  console.log('[Random] 開始跑分，rScoreFinal='+rScoreFinal);
  rScoreActive=true;
  var dur=2200,t0=null;
  function tick(ts){
    if(!t0)t0=ts;
    var t=Math.min((ts-t0)/dur,1);
    var et=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    rScoreVal=Math.round(et*rScoreFinal);
    if(t<1)requestAnimationFrame(tick);
    else{
      rScoreVal=rScoreFinal;
      setTimeout(function(){
        rPhase=null;rScoreActive=false;rFrameAlpha=0;
        busy=false;document.getElementById('abtn').style.opacity='1';
        setSt('獲得 '+rScoreFinal+'x！');
      },2000);
    }
  }
  requestAnimationFrame(tick);
}

function resetGame(){
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  shots=0;busy=false;curTx=602;curTy=115;curAng=0;
  setBelly(1,1);setFire(0,null);currentDragonIdx=0;jawAngle=0;
  turretPhase=null;tScaleX=0;tScaleY=0;tAlpha=0;
  rPhase=null;rFireSeq=[];rIdx=0;rScoreVal=0;rScoreFinal=0;rScoreActive=false;rFrameAlpha=0;
  gParticles=[];window._gatherCX=null;
  if(gatherRaf){cancelAnimationFrame(gatherRaf);gatherRaf=null;}
  if(fireRaf){cancelAnimationFrame(fireRaf);fireRaf=null;}
  const tw=document.getElementById('turretWrap');if(tw)tw.style.display='none';
  scoreVal=0;scoreFinal=0;
  if(scoreRafId){cancelAnimationFrame(scoreRafId);scoreRafId=null;}
  allCoins=[];
  window._dragonScale=0.72;
  document.getElementById('abtn').style.opacity='1';
  document.getElementById('mulEl').style.opacity='0';
  document.getElementById('winEl').style.display='none';
  const pw=document.getElementById('prizeWrap');if(pw){pw.style.visibility='hidden';pw.style.opacity='0';}
  setSt('');
}
